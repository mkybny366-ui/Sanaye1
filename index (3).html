<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>

dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:24px;width:min(380px,90vw)}
dialog::backdrop{background:#000a}dialog h3{margin:0 0 12px}
dialog input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font:inherit;margin-bottom:12px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}

@media(max-width:820px){body{flex-direction:column}aside{width:100%;height:auto;position:sticky;z-index:5;padding:10px;border:0;border-bottom:1px solid var(--line)}.brand{display:none}nav{display:flex;gap:4px;overflow-x:auto}nav button{width:auto;white-space:nowrap;padding:9px 14px;margin:0}main{padding:16px 14px 80px}.top h1{font-size:24px}.free h2{font-size:26px}.promo h2{font-size:23px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
select.s{appearance:auto}a.btn{text-decoration:none;display:inline-block}.row .s{flex:1;min-width:140px;margin:0}
</style>

'<div class="card"><b>الكورسات ('+C.length+')</b>'+C.map(c=>'<div class="lead" style="padding:8px 0"><b>'+esc(c.title)+'</b><span>'+(c.free?"مجاني":esc(c.price)+" ج.م")+'</span><button class="btn gh" data-a="delc" data-i="'+c.id+'">حذف</button></div>').join("")+'</div>'+
'<div class="card"><b>ملفات PDF ('+P.length+')</b>'+P.map(p=>'<div class="lead" style="padding:8px 0"><b>'+esc(p.title)+'</b><button class="btn gh" data-a="delpf" data-i="'+p.id+'">حذف</button></div>').join("")+'</div>'+
'<div class="card"><b>أكواد الفتح</b><div class="row"><select class="s" id="cc">'+o+'</select><button class="btn am" data-a="gen">توليد كود</button></div>'+CODES.map(k=>{const c=C.find(x=>x.id==k.courseId);return'<div class="lead" style="padding:8px 0"><b dir="ltr" style="text-align:end">'+esc(k.id)+'</b><span>'+esc(c?c.title:"؟")+(k.used?" – مستخدم":"")+'</span><button class="btn gh" data-a="delk" data-i="'+esc(k.id)+'">حذف</button></div>'}).join("")+'</div>'}};
function render(){const N=[...NAV];if(admin)N.push(["adm","إدارة","⚙️","لوحة التحكم"]);const n=N.find(x=>x[0]==S.v)||N[0];$("sub").textContent=n[3];
$("login").textContent=me?"خروج ("+(me.displayName||"حسابي")+")":"دخول ⇥";
$("nav").innerHTML=N.map(x=>'<button class="'+(x[0]==S.v?"on":"")+'" data-a="go" data-i="'+x[0]+'">'+x[2]+' '+x[1]+'</button>').join("");
const a=document.activeElement,fo=a&&a.id,fv=fo&&a.value,p=fo&&a.selectionStart;
$("view").innerHTML=(GATED.includes(S.v)&&!me)?gate():(S.v=="adm"&&!admin?gate():V[S.v]());
const q=$("q");if(q)q.oninput=()=>{S.q=q.value;render()};
if(fo&&$(fo)&&fv!=null&&fo!="em"&&fo!="pw"&&fo!="nm"){$(fo).value=fv;$(fo).focus();try{$(fo).setSelectionRange(p,p)}catch(e){}}}
const arr=s=>s.docs.map(d=>({...d.data(),id:d.id}));
const listen=(r,fn,keep)=>{const u=onSnapshot(r,s=>{fn(arr(s));render()},warn);(keep?unsubs:[]).push(u)};
listen(collection(fs,"courses"),r=>C=r.sort((a,b)=>a.ts-b.ts));listen(collection(fs,"pdfs"),r=>P=r.sort((a,b)=>a.ts-b.ts));
onAuthStateChanged(auth,async u=>{unsubs.forEach(f=>f());unsubs=[];me=u;admin=false;SUBS=[];DONE=[];POSTS=[];BOARD=[];CODES=[];
if(u){try{admin=(await getDoc(doc(fs,"admins",u.uid))).exists()}catch(e){warn(e)}
listen(collection(fs,"users",u.uid,"subs"),r=>SUBS=r.map(x=>x.id),1);
onSnapshot(doc(fs,"users",u.uid),s=>{DONE=(s.data()||{}).done||[];render()},warn);
listen(collection(fs,"posts"),r=>POSTS=r.sort((a,b)=>b.ts-a.ts),1);listen(collection(fs,"board"),r=>BOARD=r,1);
if(admin)listen(collection(fs,"codes"),r=>CODES=r,1)}render()});
const v=id=>($(id)||{value:""}).value.trim();
const dlg=$("dlg"),openDlg=()=>{$("err").textContent="";dlg.showModal()};
$("login").onclick=()=>me?signOut(auth):openDlg();$("bx").onclick=()=>dlg.close();
$("bin").onclick=()=>{$("err").textContent="";signInWithEmailAndPassword(auth,v("em"),$("pw").value).then(()=>{dlg.close();toast("أهلًا بيك")}).catch(fail)};
$("bup").onclick=async()=>{$("err").textContent="";const n=v("nm");if(!n)return $("err").textContent="اكتب اسمك الأول";try{const c=await createUserWithEmailAndPassword(auth,v("em"),$("pw").value);await updateProfile(c.user,{displayName:n});dlg.close();render();toast("أهلًا "+n)}catch(e){fail(e)}};
$("bgo").onclick=()=>{$("err").textContent="";signInWithPopup(auth,new GoogleAuthProvider()).then(()=>dlg.close()).catch(fail)};
$("theme").onclick=function(){const d=document.documentElement,l=d.dataset.theme=="light";d.dataset.theme=l?"dark":"light";this.textContent=l?"🌙":"☀️"};
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=b.dataset.i;
try{
if(a=="go"){S.v=i;render();scrollTo(0,0)}else if(a=="f"){S.f=i;render()}else if(a=="g"){S.g=i;render()}else if(a=="msg"){S.msg=(S.msg+1)%MSGS.length;render()}else if(a=="auth")openDlg();
else if(!me)openDlg();
else if(a=="sub"){await setDoc(doc(fs,"users",me.uid,"subs",i),{ts:Date.now()});savePts(DONE,[...SUBS,i]);toast("تم الاشتراك")}
else if(a=="open"){const s=await getDoc(doc(fs,"courses",i,"content","main")),l=s.exists()&&s.data().link;if(/^https?:\/\//.test(l||""))window.open(l,"_blank","noopener");else toast("لسه ما اتضافش رابط للكورس")}
else if(a=="ck"){const d=DONE.includes(+i)?DONE.filter(x=>x!=+i):[...DONE,+i];await setDoc(doc(fs,"users",me.uid),{done:d});savePts(d,SUBS)}
else if(a=="post"){const t=v("pt");if(!t)return toast("اكتب منشورك أولًا");await addDoc(collection(fs,"posts"),{uid:me.uid,name:me.displayName||"طالب",g:i,t:t.slice(0,1000),ts:Date.now()})}
else if(a=="delp")await deleteDoc(doc(fs,"posts",i));
else if(a=="code"){const c=v("cd").toUpperCase();if(!c)return;const r=doc(fs,"codes",c),s=await getDoc(r);if(!s.exists()||s.data().used)return toast("الكود غير صحيح أو مستخدم");const cid=s.data().courseId;await updateDoc(r,{used:true,by:me.uid});await setDoc(doc(fs,"users",me.uid,"subs",cid),{code:c,ts:Date.now()});savePts(DONE,[...SUBS,cid]);toast("تم فتح الحصة");S.v="home";render()}
else if(!admin)return;
else if(a=="addc"){const t=v("ct"),s=v("cs");if(!t||!s)return toast("اكتب الاسم والمادة");const pr=+v("cp")||0,r=await addDoc(collection(fs,"courses"),{title:t,subject:s,price:pr,free:pr==0,ts:Date.now()});await setDoc(doc(fs,"courses",r.id,"content","main"),{link:v("cl")});["ct","cs","cl","cp"].forEach(x=>$(x).value="");toast("تمت الإضافة")}
else if(a=="addp"){const t=v("pt2");if(!t)return toast("اكتب اسم الملف");await addDoc(collection(fs,"pdfs"),{title:t,subject:v("ps")||"عام",link:v("pl"),price:+v("pp")||0,ts:Date.now()});["pt2","ps","pl","pp"].forEach(x=>$(x).value="");toast("تمت الإضافة")}
else if(a=="delc"){await deleteDoc(doc(fs,"courses",i,"content","main"));await deleteDoc(doc(fs,"courses",i))}
else if(a=="delpf")await deleteDoc(doc(fs,"pdfs",i));
else if(a=="gen"){const cid=v("cc");if(!cid)return toast("أضف كورسًا أولًا");const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";const x=crypto.getRandomValues(new Uint8Array(8));x.forEach(n=>c+=A[n%A.length]);await setDoc(doc(fs,"codes",c),{courseId:cid,used:false,ts:Date.now()});toast("الكود: "+c)}
else if(a=="delk")await deleteDoc(doc(fs,"codes",i));
}catch(err){fail(err)}});
render();
</script>
</body>
</html>
